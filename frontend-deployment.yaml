apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: games-legend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: youssef4403/games-legend-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
