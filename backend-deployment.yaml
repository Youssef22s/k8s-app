apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: games-legend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: youssef4403/games-legend-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
    
          resources:
           requests:
            cpu: "100m"
            memory: "128Mi"
           limits:
            cpu: "500m"
            memory: "512Mi"
       
          readinessProbe:
           httpGet:
            path: /health
            port: 5000
           initialDelaySeconds: 5
           periodSeconds: 5  

          livenessProbe:
           httpGet:
            path: /health
            port: 5000
           initialDelaySeconds: 10
           periodSeconds: 5
  
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_USER

            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: FRONTEND_URL

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET_KEY
                
            - name: STRIPE_SECRET_KEY
              valueFrom:
                 secretKeyRef:
                  name: backend-secret
                  key: STRIPE_SECRET_KEY
