apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: games-legend
  namespace: games-legend

spec:
  ingressClassName: nginx

  rules:
    - host: games-legend.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend
                port:
                  number: 80
