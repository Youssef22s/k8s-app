apiVersion: v1
kind: Pod
metadata:
  name: scheduling-affinity
  namespace: games-legend

spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - desktop-worker

  containers:
    - name: nginx
      image: nginx:alpine
