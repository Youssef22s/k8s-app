apiVersion: v1
kind: Pod
metadata:
  name: scheduling-preferred
  namespace: games-legend

spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - desktop-worker

  containers:
    - name: nginx
      image: nginx:alpine
